[project]
name = "zq-rag-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuqishun", email = "keng0901956007@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.25.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "markdown-it-py>=4.2.0",
    "minio>=7.2.20",
    "neo4j>=6.3.0",
    "openai>=3.6.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.10",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
    "xlrd>=2.0.2",
]

[tool.uv.build-backend]
module-name = "zq_rag_app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
eval = [
    "ragas>=0.3.1",
]
